<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Pages テスト</title>
<style>
:root {
--bg: #f6f5f1;
--fg: #1f1f1f;
--muted: #6b6b6b;
--card: #ffffff;
--line: #e3e1da;
--accent: #2f6f5e;
}
@media (prefers-color-scheme: dark) {
:root {
--bg: #161616;
--fg: #ecebe6;
--muted: #9a9a9a;
--card: #1f1f1f;
--line: #2e2e2e;
--accent: #6fc2a8;
}
}
* { box-sizing: border-box; }
body {
margin: 0;
min-height: 100vh;
display: grid;
place-items: center;
padding: 24px 16px;
background: var(--bg);
color: var(--fg);
font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
line-height: 1.6;
}
main {
width: 100%;
max-width: 520px;
background: var(--card);
border: 1px solid var(--line);
border-radius: 16px;
padding: 28px 24px;
}
.status {
display: inline-flex;
align-items: center;
gap: 8px;
font-size: 13px;
color: var(--accent);
font-weight: 600;
}
.dot {
width: 8px; height: 8px; border-radius: 50%;
background: var(--accent);
animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse { 50% { opacity: .3; } }
h1 { margin: 12px 0 4px; font-size: 26px; }
p.lead { margin: 0 0 20px; color: var(--muted); }
dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: 14px; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-all; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
button {
margin-top: 22px;
padding: 10px 16px;
border: 0;
border-radius: 10px;
background: var(--accent);
color: var(--card);
font: inherit;
font-weight: 600;
cursor: pointer;
}
#count { margin-left: 10px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
<span class="status"><span class="dot"></span>公開中</span>
<h1>Hello, GitHub Pages</h1>
<p class="lead">このページが見えていれば、デプロイは成功しています。</p>

<dl>
<dt>URL</dt><dd id="url">—</dd>
<dt>表示時刻</dt><dd id="time">—</dd>
<dt>画面幅</dt><dd id="width">—</dd>
<dt>ブラウザ</dt><dd id="ua">—</dd>
</dl>

<button id="btn">JSの動作確認</button><span id="count">0 回</span>
</main>

<script>
document.getElementById('url').textContent = location.href;
document.getElementById('ua').textContent = navigator.userAgent;
const tick = () => document.getElementById('time').textContent = new Date().toLocaleString('ja-JP');
const size = () => document.getElementById('width').textContent = innerWidth + ' px';
tick(); size();
setInterval(tick, 1000);
addEventListener('resize', size);

let n = 0;
document.getElementById('btn').addEventListener('click', () => {
document.getElementById('count').textContent = (++n) + ' 回';
});
</script>
</body>
</html>
