<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>AR</title>
<style>
:root {
  --bg: #111;
  --fg: #f4f1ea;
  --muted: #a9a59c;
  --accent: #f5c400;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  -webkit-user-select: none;
  user-select: none;
}
#ar {
  position: fixed;
  inset: 0;
  overflow: hidden;
}
.screen {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  text-align: center;
  z-index: 10;
}
#start { background: var(--bg); }
#start h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: .04em; }
#start p { margin: 0 0 28px; color: var(--muted); line-height: 1.7; font-size: 14px; }
button {
  padding: 14px 28px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: #111;
  font: inherit;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
}
button:disabled { opacity: .5; }
#msg { margin-top: 16px; color: var(--muted); font-size: 13px; min-height: 1em; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body>
<div id="ar"></div>

<section id="start" class="screen">
  <div>
    <h1>AR</h1>
    <p>カメラを起動して、マーカーにかざしてください。</p>
    <button id="startBtn">はじめる</button>
    <div id="msg"></div>
  </div>
</section>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

// targets.mind に入っているマーカーの順番
const TARGET = { camera: 0, guitar: 1, ramen: 2, beach: 3 };

const startScreen = document.getElementById('start');
const startBtn = document.getElementById('startBtn');
const msg = document.getElementById('msg');

const mindar = new MindARThree({
  container: document.getElementById('ar'),
  imageTargetSrc: './targets.mind',
  maxTrack: 1,
  filterMinCF: 0.0001,
  filterBeta: 0.001,
});
const { renderer, scene, camera } = mindar;

// ---- ラーメン：マーカーの上に動画を重ねる ----
const ramenVideo = document.createElement('video');
ramenVideo.src = './assets/ramen.mp4';
ramenVideo.muted = true;
ramenVideo.loop = false; // 一回だけ再生して最後のコマで止める
ramenVideo.playsInline = true;
ramenVideo.setAttribute('playsinline', '');
ramenVideo.setAttribute('webkit-playsinline', '');
ramenVideo.preload = 'auto';
ramenVideo.crossOrigin = 'anonymous';

const ramenTex = new THREE.VideoTexture(ramenVideo);
ramenTex.colorSpace = THREE.SRGBColorSpace;
const ramenPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1), // マーカーと同じ大きさ（正方形）
  new THREE.MeshBasicMaterial({ map: ramenTex })
);
const ramenAnchor = mindar.addAnchor(TARGET.ramen);
ramenAnchor.group.add(ramenPlane);
ramenAnchor.onTargetFound = () => {
  // 途中で見失った場合は続きから。一度見終わったら、映し直しても最後のコマのまま
  if (ramenVideo.ended) return;
  ramenVideo.play().catch(() => {});
};
ramenAnchor.onTargetLost = () => ramenVideo.pause();

// ---- ギター・海：アニメーション待ち（認識確認用の仮表示） ----
function placeholder(label) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(0,0,0,.55)';
  g.fillRect(0, 0, 512, 512);
  g.strokeStyle = '#f5c400';
  g.lineWidth = 12;
  g.strokeRect(6, 6, 500, 500);
  g.fillStyle = '#fff';
  g.font = 'bold 64px sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText(label, 256, 220);
  g.font = '36px sans-serif';
  g.fillText('準備中', 256, 310);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true })
  );
}
mindar.addAnchor(TARGET.guitar).group.add(placeholder('GUITAR'));
mindar.addAnchor(TARGET.beach).group.add(placeholder('BEACH'));

// ---- カメラ：起動時に撮った顔写真を、スマホの枠の画面に入れて出す ----
// assets/phone-frame.png の画面部分（1000px 四方の画像での位置）
const SCREEN = { x: 295, y: 334, w: 498, h: 366 };
const phoneFrame = new Image();
phoneFrame.src = './assets/phone-frame.png';

const phoneCanvas = document.createElement('canvas');
phoneCanvas.width = phoneCanvas.height = 1000;
const phoneTex = new THREE.CanvasTexture(phoneCanvas);
phoneTex.colorSpace = THREE.SRGBColorSpace;
const phonePlane = new THREE.Mesh(
  new THREE.PlaneGeometry(1, 1),
  new THREE.MeshBasicMaterial({ map: phoneTex })
);
mindar.addAnchor(TARGET.camera).group.add(phonePlane);

let selfiePhoto = null; // 撮った写真（canvas）

function drawPhone() {
  const g = phoneCanvas.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, 1000, 1000);
  if (selfiePhoto) {
    // 画面の形に合わせて中央を切り抜く（顔が入りやすいよう少し上寄せ）
    const pw = selfiePhoto.width, ph = selfiePhoto.height;
    const s = Math.max(SCREEN.w / pw, SCREEN.h / ph);
    const sw = SCREEN.w / s, sh = SCREEN.h / s;
    const sx = (pw - sw) / 2, sy = (ph - sh) * 0.4;
    g.drawImage(selfiePhoto, sx, sy, sw, sh, SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h);
  }
  if (phoneFrame.complete) g.drawImage(phoneFrame, 0, 0, 1000, 1000);
  phoneTex.needsUpdate = true;
}
phoneFrame.onload = drawPhone;

// 内カメで1枚撮る。写真は端末の中だけで使い、どこにも送らない
async function captureSelfie() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
    });
    const v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(v);
    v.srcObject = stream;
    await v.play();
    // 起動直後は暗いので、露出が落ち着くまで少し待つ
    await new Promise(r => setTimeout(r, 700));
    const c = document.createElement('canvas');
    c.width = v.videoWidth;
    c.height = v.videoHeight;
    const g = c.getContext('2d');
    // 内カメは鏡に映したように左右反転しておく
    g.translate(c.width, 0);
    g.scale(-1, 1);
    g.drawImage(v, 0, 0);
    v.remove();
    selfiePhoto = c;
    drawPhone();
  } catch (e) {
    console.warn('内カメで撮影できませんでした', e);
  } finally {
    if (stream) stream.getTracks().forEach(t => t.stop());
  }
}

// ---- 起動 ----
async function startAR() {
  await mindar.start();
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  msg.textContent = 'カメラを起動しています…';
  // iOS で動画を再生できるよう、タップの中で一度再生しておく
  ramenVideo.play().then(() => ramenVideo.pause()).catch(() => {});
  try {
    // 先に内カメで撮ってから、背面カメラの AR を始める（スマホは同時に2つのカメラを使えない）
    await captureSelfie();
    await startAR();
    startScreen.remove();
  } catch (e) {
    console.error(e);
    msg.textContent = 'カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。';
    startBtn.disabled = false;
  }
});
</script>
</body>
</html>
