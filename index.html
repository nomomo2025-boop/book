<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<!-- ホーム画面に追加して開くと、Safari のバーなしの全画面になる -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>カメラ</title>
<style>
:root {
  --bg: #000;
  --fg: #fff;
  --muted: #8e8e93;
  --yellow: #ffd60a;
  --top: calc(env(safe-area-inset-top) + 44px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* ---- カメラアプリ風の画面 ---- */
#cam {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
}
#topbar {
  flex: none;
  height: var(--top);
  padding: env(safe-area-inset-top) 18px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
#topbar svg { display: block; }
#viewfinder {
  position: relative;
  flex: none;
  width: 100%;
  aspect-ratio: 3 / 4;
  max-height: calc(100% - var(--top) - 170px);
  overflow: hidden;
  background: #111;
}
/* z-index を付けて重なりの基準にしないと、MindAR のカメラ映像が背景の下に隠れる */
#ar { position: absolute; inset: 0; overflow: hidden; z-index: 0; }
#blink {
  position: absolute; inset: 0;
  background: #000;
  opacity: 0;
  pointer-events: none;
  z-index: 3;
}
#blink.on { animation: blink .22s ease-out; }
@keyframes blink { 0% { opacity: 1; } 100% { opacity: 0; } }
#zoom {
  position: absolute;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(0, 0, 0, .28);
  z-index: 2;
}
#zoom span {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: rgba(0, 0, 0, .45);
  font-size: 11px;
  font-weight: 600;
}
#zoom span.on {
  width: 36px; height: 36px; margin: -3px 0;
  color: var(--yellow);
  font-size: 13px;
}
#bottom {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  padding-bottom: env(safe-area-inset-bottom);
  min-height: 170px;
}
#modes {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  gap: 22px;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: .02em;
  white-space: nowrap;
  overflow: hidden;
}
#modes .side { display: flex; gap: 22px; color: var(--fg); opacity: .95; min-width: 0; overflow: hidden; }
/* 左側は右端（写真のすぐ隣）にそろえ、はみ出した分は左で切る */
#modes .left { flex-direction: row-reverse; }
#modes .now { color: var(--yellow); font-weight: 600; }
#controls {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 30px;
}
#thumb {
  justify-self: start;
  width: 48px; height: 48px;
  border-radius: 8px;
  overflow: hidden;
  background: #1c1c1e;
  border: 1px solid rgba(255, 255, 255, .15);
}
#thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
#shutter {
  width: 76px; height: 76px;
  border-radius: 50%;
  border: 4px solid #fff;
  display: grid;
  place-items: center;
}
#shutter::after {
  content: "";
  width: 62px; height: 62px;
  border-radius: 50%;
  background: #fff;
  transition: transform .12s;
}
#shutter:active::after { transform: scale(.9); }
#flip {
  justify-self: end;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .12);
  display: grid;
  place-items: center;
  transition: transform .4s;
}
#flip.spin { transform: rotate(180deg); }

/* 撮った写真を見る画面（長押しで保存できる） */
#viewer {
  position: fixed; inset: 0;
  background: #000;
  z-index: 20;
  display: none;
  flex-direction: column;
}
#viewer.on { display: flex; }
#viewer header {
  height: var(--top);
  padding: env(safe-area-inset-top) 16px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 15px;
}
#viewer header button { color: var(--yellow); font-size: 17px; }
#viewer .photo { flex: 1; display: grid; place-items: center; overflow: hidden; }
#viewer img { max-width: 100%; max-height: 100%; -webkit-touch-callout: default; user-select: auto; }
#viewer p { margin: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); text-align: center; color: var(--muted); font-size: 12px; }

/* ---- 最初の画面 ---- */
#start {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 24px 16px;
  text-align: center;
  background: var(--bg);
}
#start h1 { margin: 0 0 8px; font-size: 26px; font-weight: 600; letter-spacing: .04em; }
#start p { margin: 0 0 28px; color: var(--muted); line-height: 1.7; font-size: 14px; }
#startBtn {
  padding: 14px 32px;
  border-radius: 999px;
  background: var(--yellow);
  color: #000;
  font-weight: 700;
  font-size: 16px;
}
#startBtn:disabled { opacity: .5; }
#msg { margin-top: 16px; color: var(--muted); font-size: 13px; min-height: 1em; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="cam">
  <div id="topbar">
    <!-- フラッシュ（オフ） -->
    <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="1.6" aria-hidden="true">
      <circle cx="13" cy="13" r="11.5"/>
      <path d="M14.2 6.5 9 14h3.6l-1 5.5L17 12h-3.6z" fill="#fff" stroke="none"/>
      <path d="M6 6l14 14" stroke-linecap="round"/>

    <!-- 設定を開く山形 -->
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

  <div id="viewfinder">

  <div id="bottom">
    <div id="modes" aria-hidden="true">
      <div class="side left"><span>ビデオ</span><span>スロー</span><span>タイムラプス</span></div>
      <span class="now">写真</span>
      <div class="side"><span>ポートレート</span><span>パノラマ</span></div>
    </div>
    <div id="controls">
      <button id="thumb" aria-label="撮った写真を見る"></button>
      <button id="shutter" aria-label="撮影"></button>
      <button id="flip" aria-label="カメラ切り替え">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.5 10.5A8 8 0 0 0 6.2 8.2M5.5 15.5a8 8 0 0 0 14.3 2.3"/>
          <path d="M6 4.5v4h4M20 21.5v-4h-4"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<section id="viewer">
  <header><span id="viewerDate"></span><button id="viewerClose">完了</button></header>
  <div class="photo"><img id="viewerImg" alt="撮った写真"></div>
  <p>写真を長押しすると保存できます</p>
</section>

<section id="start">
  <div>
    <h1>AR</h1>
    <p>カメラを起動して、マーカーにかざしてください。</p>
    <button id="startBtn">はじめる</button>
    <div id="msg"></div>
  </div>
</section>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

// targets.mind に入っているマーカーの順番
const TARGET = { camera: 0, guitar: 1, ramen: 2, beach: 3 };

const startScreen = document.getElementById('start');
const startBtn = document.getElementById('startBtn');
const msg = document.getElementById('msg');

// 追従の調整値。URL の後ろに ?cf=0.001&beta=0.01&warm=3&miss=10 のように付けると、
// 公開し直さずに実機で試せる
//   cf   : 止まっているときの揺れ止め。小さいほど揺れないが、遅れてついてくる
//   beta : 動かしたときの追いつきやすさ。大きいほど遅れないが、揺れが残る
//   warm : 何コマ続けて見えたら表示するか（小さいほど早く出るが、誤反応しやすい）
//   miss : 何コマ見失ったら消すか（大きいほど一瞬見失っても消えない）
const params = new URLSearchParams(location.search);
const num = (key, def) => {
  const v = parseFloat(params.get(key));
  return Number.isFinite(v) ? v : def;
};
const TRACKING = {
  filterMinCF: num('cf', 0.001),
  filterBeta: num('beta', 0.01),
  warmupTolerance: num('warm', 3),
  missTolerance: num('miss', 10),
};

const mindar = new MindARThree({
  container: document.getElementById('ar'),
  imageTargetSrc: './targets.mind',
  maxTrack: 1,
  // MindAR 自前の「読み込み中」「スキャン中」の表示は出さない（カメラアプリらしく見せるため）
  uiLoading: 'no',
  uiScanning: 'no',
  ...TRACKING,
});
const { renderer, scene, camera } = mindar;

// ---- 揺れ止め ----
// MindAR が出すマーカーの位置をそのまま使わず、表示用のグループに少し遅れて追いかけさせる。
// 小さな動き（揺れ）にはゆっくり、大きな動きにはすぐ追いつくので、止めているときは揺れにくい。
// URL の ?smooth=0.06&move=0.04 で調整できる
//   smooth : 止まっているときに1コマで追いつく割合。小さいほど揺れないが、ぬるっと遅れる
//   move   : マーカーの幅に対してこれ以上動いたら、揺れではなく本当の動きとみなしてすぐ追いつく
const SMOOTH = {
  rest: num('smooth', 0.06),
  move: num('move', 0.04),
};
// ---- ジャイロで補う ----
// カメラ画像からの位置計算は1秒に数十回しか出ず、しかも少し遅れて届く。
// その間にスマホを回した分を、向きのセンサーから求めて先回りして映像を回す。
// URL に ?gyro=0 を付けると切れる（比較用）
const gyro = {
  enabled: num('gyro', 1) !== 0,
  ready: false,
  quat: new THREE.Quaternion(), // いまのカメラの向き（世界の中で）
};
{
  const euler = new THREE.Euler();
  const zAxis = new THREE.Vector3(0, 0, 1);
  const screenFix = new THREE.Quaternion();
  // スマホの画面の向き（x:右, y:上, z:手前）から、背面カメラの向きに合わせる補正
  const cameraFix = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
  const deg = Math.PI / 180;
  addEventListener('deviceorientation', e => {
    if (!gyro.enabled || e.alpha === null) return;
    const orient = (screen.orientation?.angle ?? window.orientation ?? 0) * deg;
    euler.set(e.beta * deg, e.alpha * deg, -e.gamma * deg, 'YXZ');
    gyro.quat.setFromEuler(euler).multiply(cameraFix)
      .multiply(screenFix.setFromAxisAngle(zAxis, -orient));
    gyro.ready = true;
  });
}
// iPhone ではセンサーを使うのに許可が要る。「はじめる」を押したときに呼ぶ
function requestGyroPermission() {
  const D = window.DeviceOrientationEvent;
  if (gyro.enabled && D && typeof D.requestPermission === 'function') {
    return D.requestPermission().catch(() => 'denied');
  }
  return Promise.resolve('granted');
}

const smoothed = [];
function addSmoothAnchor(index) {
  const anchor = mindar.addAnchor(index);
  const group = new THREE.Group();
  group.matrixAutoUpdate = false;
  group.visible = false;
  scene.add(group);
  const s = {
    anchor, group, ready: false,
    pos: new THREE.Vector3(), quat: new THREE.Quaternion(), scale: new THREE.Vector3(),
    trackQuat: new THREE.Quaternion(), hasTrackQuat: false,
  };
  // 位置の計算結果が届いた瞬間のスマホの向きを覚えておく
  anchor.onTargetUpdate = () => {
    s.hasTrackQuat = gyro.ready;
    if (gyro.ready) s.trackQuat.copy(gyro.quat);
  };
  smoothed.push(s);
  return { anchor, group };
}

const tPos = new THREE.Vector3(), tQuat = new THREE.Quaternion(), tScale = new THREE.Vector3();
const turn = new THREE.Quaternion(), turnMatrix = new THREE.Matrix4(), predicted = new THREE.Matrix4();
let lastFrame = 0;
function updateSmoothing(now) {
  // 60fps を1コマとして、コマ落ちしても同じ速さで追いつくようにする
  const frames = lastFrame ? Math.min((now - lastFrame) / (1000 / 60), 4) : 1;
  lastFrame = now;
  for (const s of smoothed) {
    if (!s.anchor.group.visible) {
      s.group.visible = false;
      s.ready = false;
      continue;
    }
    predicted.copy(s.anchor.group.matrix);
    if (gyro.ready && s.hasTrackQuat) {
      // 計算結果が届いてから今までにスマホが回った分だけ、マーカーを逆向きに回す
      turn.copy(gyro.quat).invert().multiply(s.trackQuat);
      predicted.premultiply(turnMatrix.makeRotationFromQuaternion(turn));
    }
    predicted.decompose(tPos, tQuat, tScale);
    if (!s.ready) {
      // 見つけた瞬間はそのまま置く
      s.pos.copy(tPos); s.quat.copy(tQuat); s.scale.copy(tScale);
      s.ready = true;
    } else {
      const size = tScale.x || 1;
      const moved = Math.max(
        tPos.distanceTo(s.pos) / size / SMOOTH.move,
        s.quat.angleTo(tQuat) / (SMOOTH.move * 2)
      );
      const k = Math.min(1, moved);
      const perFrame = SMOOTH.rest + (1 - SMOOTH.rest) * k * k;
      const a = 1 - Math.pow(1 - perFrame, frames);
      s.pos.lerp(tPos, a);
      s.quat.slerp(tQuat, a);
      s.scale.lerp(tScale, a);
    }
    s.group.matrix.compose(s.pos, s.quat, s.scale);
    s.group.visible = true;
  }
}

// ---- 映像の縁 ----
// 映像をマーカーより少し大きくして、縁をふわっと透明にする。
// 少しずれても下のマーカーの縁がはみ出して見えにくくなる
const EDGE = {
  size: num('edge', 1.06), // マーカーに対する大きさ
  fade: 0.06,              // 縁から何割の幅でぼかすか
};
const edgeAlpha = (() => {
  const n = 256;
  const c = document.createElement('canvas');
  c.width = c.height = n;
  const g = c.getContext('2d');
  const img = g.createImageData(n, n);
  const smooth = t => t * t * (3 - 2 * t);
  for (let y = 0; y < n; y++) {
    for (let x = 0; x < n; x++) {
      const d = Math.min(x, y, n - 1 - x, n - 1 - y) / (n - 1); // 一番近い縁までの距離
      const v = Math.round(255 * smooth(Math.min(1, d / EDGE.fade)));
      const i = (y * n + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return new THREE.CanvasTexture(c);
})();
function edgePlane(map) {
  return new THREE.Mesh(
    new THREE.PlaneGeometry(EDGE.size, EDGE.size),
    new THREE.MeshBasicMaterial({ map, alphaMap: edgeAlpha, transparent: true })
  );
}

// ---- ラーメン：マーカーの上に動画を重ねる ----
const ramenVideo = document.createElement('video');
ramenVideo.src = './assets/ramen.mp4';
ramenVideo.muted = true;
ramenVideo.loop = false; // 一回だけ再生して最後のコマで止める
ramenVideo.playsInline = true;
ramenVideo.setAttribute('playsinline', '');
ramenVideo.setAttribute('webkit-playsinline', '');
ramenVideo.preload = 'auto';
ramenVideo.crossOrigin = 'anonymous';

const ramenTex = new THREE.VideoTexture(ramenVideo);
ramenTex.colorSpace = THREE.SRGBColorSpace;
const ramenPlane = edgePlane(ramenTex);
const { anchor: ramenAnchor, group: ramenGroup } = addSmoothAnchor(TARGET.ramen);
ramenGroup.add(ramenPlane);
ramenAnchor.onTargetFound = () => {
  // 途中で見失った場合は続きから。一度見終わったら、映し直しても最後のコマのまま
  if (ramenVideo.ended) return;
  ramenVideo.play().catch(() => {});
};
ramenAnchor.onTargetLost = () => ramenVideo.pause();

// ---- ギター・海：動画をマーカーに重ねて、ずっとループ再生する ----
// マーカーから外れたら一時停止し、映し直すと続きから動く
function addLoopVideo(target, src) {
  const video = document.createElement('video');
  video.src = src;
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.setAttribute('playsinline', '');
  video.setAttribute('webkit-playsinline', '');
  video.preload = 'auto';
  video.crossOrigin = 'anonymous';

  const tex = new THREE.VideoTexture(video);
  tex.colorSpace = THREE.SRGBColorSpace;
  const { anchor, group } = addSmoothAnchor(target);
  group.add(edgePlane(tex));
  anchor.onTargetFound = () => video.play().catch(() => {});
  anchor.onTargetLost = () => video.pause();
  return video;
}
const liveVideo = addLoopVideo(TARGET.guitar, './assets/live.mp4');
const seaVideo = addLoopVideo(TARGET.beach, './assets/sea.mp4');

// ---- カメラ：起動時に撮った顔写真を、スマホの枠の画面に入れて出す ----
// assets/phone-frame.png の画面部分（1000px 四方の画像での位置）
const SCREEN = { x: 295, y: 334, w: 498, h: 366 };
const phoneFrame = new Image();
phoneFrame.src = './assets/phone-frame.png';

const phoneCanvas = document.createElement('canvas');
phoneCanvas.width = phoneCanvas.height = 1000;
const phoneTex = new THREE.CanvasTexture(phoneCanvas);
phoneTex.colorSpace = THREE.SRGBColorSpace;
const phonePlane = edgePlane(phoneTex);
addSmoothAnchor(TARGET.camera).group.add(phonePlane);

let selfiePhoto = null; // 撮った写真（canvas、左右反転済み）
let selfieFace = null;  // 写真の中の顔の位置 { x, y, w, h }（見つからなければ null）

// 写真のどこを切り抜いて画面に入れるか
function selfieCrop() {
  const pw = selfiePhoto.width, ph = selfiePhoto.height;
  const aspect = SCREEN.w / SCREEN.h;
  let cw, ch, cx, cy;
  if (selfieFace) {
    // 顔の枠が画面の高さの半分くらいになるように、顔を中心に切り抜く
    ch = selfieFace.h / 0.5;
    cw = ch * aspect;
    cx = selfieFace.x + selfieFace.w / 2;
    cy = selfieFace.y + selfieFace.h / 2 - selfieFace.h * 0.08; // 髪が入るよう少し上に
  } else {
    // 顔が見つからなかったときは、中央やや上を大きく切り抜く
    cw = pw; ch = pw / aspect;
    cx = pw / 2; cy = ph * 0.45;
  }
  // 写真からはみ出さないように縮めて、位置もずらす
  const fit = Math.min(1, pw / cw, ph / ch);
  cw *= fit; ch *= fit;
  const sx = Math.min(Math.max(cx - cw / 2, 0), pw - cw);
  const sy = Math.min(Math.max(cy - ch / 2, 0), ph - ch);
  return { sx, sy, sw: cw, sh: ch };
}

function drawPhone() {
  const g = phoneCanvas.getContext('2d');
  g.fillStyle = '#fff';
  g.fillRect(0, 0, 1000, 1000);
  if (selfiePhoto) {
    const { sx, sy, sw, sh } = selfieCrop();
    g.drawImage(selfiePhoto, sx, sy, sw, sh, SCREEN.x, SCREEN.y, SCREEN.w, SCREEN.h);
  }
  if (phoneFrame.complete) g.drawImage(phoneFrame, 0, 0, 1000, 1000);
  phoneTex.needsUpdate = true;
}
phoneFrame.onload = drawPhone;

// 顔検出（MediaPipe）。ページを開いた時点で読み込み始めておく
const TASKS_VISION = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21';
const faceDetectorReady = (async () => {
  const { FilesetResolver, FaceDetector } = await import(`${TASKS_VISION}/vision_bundle.mjs`);
  const fileset = await FilesetResolver.forVisionTasks(`${TASKS_VISION}/wasm`);
  return FaceDetector.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: './assets/blaze_face_short_range.tflite', delegate: 'CPU' },
    runningMode: 'VIDEO',
    minDetectionConfidence: 0.6,
  });
})().catch(e => { console.warn('顔検出を使えません', e); return null; });

const wait = ms => new Promise(r => setTimeout(r, ms));

// 撮るのにちょうどいい顔か（大きさ・位置・確かさ）
function goodFace(det, vw, vh) {
  const b = det.boundingBox;
  const score = det.categories[0]?.score ?? 0;
  const cx = (b.originX + b.width / 2) / vw;
  const cy = (b.originY + b.height / 2) / vh;
  return score >= 0.75 && b.width / vw >= 0.15 && cx > 0.15 && cx < 0.85 && cy > 0.1 && cy < 0.9;
}

// 内カメで顔を探し、顔がしっかり写った瞬間に1枚撮る。
// 写真は端末の中だけで使い、どこにも送らない
async function captureSelfie() {
  let stream, v;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } },
    });
    v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
    document.body.appendChild(v);
    v.srcObject = stream;
    await v.play();
    // 起動直後は暗いので、露出が落ち着くまで少し待つ
    await wait(400);

    const detector = await Promise.race([faceDetectorReady, wait(4000).then(() => null)]);
    const vw = v.videoWidth, vh = v.videoHeight;
    let face = null;

    if (detector) {
      // 顔が3回続けてちゃんと写ったら撮る。最大5秒探して、だめなら最後に見えた顔で撮る
      const deadline = performance.now() + 5000;
      let streak = 0, lastFace = null, prev = null;
      while (performance.now() < deadline) {
        const dets = detector.detectForVideo(v, performance.now()).detections;
        const det = dets.length === 1 ? dets[0] : null;
        if (det) {
          const b = det.boundingBox;
          lastFace = { x: b.originX, y: b.originY, w: b.width, h: b.height };
          // 前のコマから大きく動いていない（ブレていない）ことも条件にする
          const still = prev && Math.abs(lastFace.x - prev.x) < b.width * 0.08
                             && Math.abs(lastFace.y - prev.y) < b.height * 0.08;
          streak = goodFace(det, vw, vh) && (still || !prev) ? streak + 1 : 0;
          prev = lastFace;
          if (streak >= 3) { face = lastFace; break; }
        } else {
          streak = 0; prev = null;
        }
        await wait(80);
      }
      if (!face) face = lastFace;
    } else {
      await wait(300);
    }

    const c = document.createElement('canvas');
    c.width = vw;
    c.height = vh;
    const g = c.getContext('2d');
    // 内カメは鏡に映したように左右反転しておく
    g.translate(vw, 0);
    g.scale(-1, 1);
    g.drawImage(v, 0, 0);
    selfiePhoto = c;
    // 顔の位置も左右反転に合わせる
    selfieFace = face && { ...face, x: vw - face.x - face.w };
    drawPhone();
  } catch (e) {
    console.warn('内カメで撮影できませんでした', e);
  } finally {
    if (v) v.remove();
    if (stream) stream.getTracks().forEach(t => t.stop());
  }
}

// ---- もう一度サイトを開いたときは最初からやり直す ----
// iPhone の Safari は、戻る操作や QR から開き直したときに前のページを
// そのまま復元することがある。その場合は読み込み直して、動画の再生位置などを戻す
addEventListener('pageshow', e => {
  if (e.persisted) location.reload();
});
// 別のアプリに切り替えて、1分以上たってから戻ってきたときも同じくやり直す
// （通知を見るような短い切り替えではやり直さない）
const RESET_AFTER_HIDDEN_MS = 60000;
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    hiddenAt = Date.now();
  } else if (hiddenAt && Date.now() - hiddenAt > RESET_AFTER_HIDDEN_MS) {
    location.reload();
  }
});

// ---- シャッター：いま見えている画面（カメラ映像＋AR）を1枚の写真にする ----
const viewfinder = document.getElementById('viewfinder');
const blink = document.getElementById('blink');
const thumb = document.getElementById('thumb');
const viewer = document.getElementById('viewer');
const viewerImg = document.getElementById('viewerImg');
const viewerDate = document.getElementById('viewerDate');
let lastShot = null;

function takePhoto() {
  const video = mindar.video;
  if (!video || !video.videoWidth) return;
  const w = viewfinder.clientWidth, h = viewfinder.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const c = document.createElement('canvas');
  c.width = Math.round(w * dpr);
  c.height = Math.round(h * dpr);
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  // カメラ映像は MindAR が画面いっぱいに引き伸ばして置いているので、同じ位置に描く
  g.drawImage(video, parseFloat(video.style.left) || 0, parseFloat(video.style.top) || 0,
    parseFloat(video.style.width) || w, parseFloat(video.style.height) || h);
  // AR の絵は、描いた直後でないと読み出せないので、ここでもう一度描いてから重ねる
  renderer.render(scene, camera);
  g.drawImage(renderer.domElement, 0, 0, w, h);

  lastShot = { url: c.toDataURL('image/jpeg', 0.92), date: new Date() };
  thumb.innerHTML = '';
  const img = new Image();
  img.src = lastShot.url;
  img.alt = '';
  thumb.appendChild(img);
}

document.getElementById('shutter').addEventListener('click', () => {
  takePhoto();
  blink.classList.remove('on');
  void blink.offsetWidth; // アニメーションを最初からやり直す
  blink.classList.add('on');
});
thumb.addEventListener('click', () => {
  if (!lastShot) return;
  viewerImg.src = lastShot.url;
  viewerDate.textContent = lastShot.date.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  viewer.classList.add('on');
});
document.getElementById('viewerClose').addEventListener('click', () => viewer.classList.remove('on'));
// 切り替えボタンは回るだけ（本物のカメラアプリらしさのため）
const flip = document.getElementById('flip');
flip.addEventListener('click', () => flip.classList.toggle('spin'));

// ---- 全画面 ----
// Android などでは「はじめる」を押したときに全画面にする。
// iPhone の Safari はページを全画面にできないので、ホーム画面に追加して開いたときだけ全画面になる
function enterFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req || document.fullscreenElement || document.webkitFullscreenElement) return;
  try {
    const p = req.call(el, { navigationUI: 'hide' });
    if (p && p.then) p.then(() => screen.orientation?.lock?.('portrait')).catch(() => {});
  } catch (e) { /* 全画面にできなくてもそのまま続ける */ }
}

// ---- 起動 ----
async function startAR() {
  await mindar.start();
  renderer.setAnimationLoop(now => {
    updateSmoothing(now);
    renderer.render(scene, camera);
  });
}

startBtn.addEventListener('click', async () => {
  startBtn.disabled = true;
  enterFullscreen();
  msg.textContent = 'カメラを起動しています…';
  // iOS で動画を再生できるよう、タップの中で一度再生しておく
  ramenVideo.play().then(() => ramenVideo.pause()).catch(() => {});
  for (const v of [liveVideo, seaVideo]) v.play().then(() => v.pause()).catch(() => {});
  // ジャイロの許可も、タップの中で最初に聞く必要がある
  const gyroPermission = requestGyroPermission();
  try {
    // 先に内カメで撮ってから、背面カメラの AR を始める（スマホは同時に2つのカメラを使えない）
    await gyroPermission;
    await captureSelfie();
    await startAR();
    startScreen.remove();
  } catch (e) {
    console.error(e);
    msg.textContent = 'カメラを起動できませんでした。ブラウザのカメラ許可を確認してください。';
    startBtn.disabled = false;
  }
});
